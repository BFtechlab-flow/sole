name: FILA-Net GONG SSL Corpus Warm-up

on:
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  ssl-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Adapt ImageNet encoder on diverse real NOAA/GONG frames
        run: |
          python scripts/pretrain_gong_ssl.py \
            --imagenet-pretrained \
            --output artifacts/pretrain/gong_ssl_imagenet.pt \
            --manifest artifacts/pretrain/gong_ssl_imagenet.json \
            --max-images 6 \
            --min-images 4 \
            --epochs 2 \
            --steps-per-epoch 12 \
            --image-size 224 \
            --seed 2026
      - name: Verify checkpoint can load into FILA-Net
        run: |
          python - <<'PY'
          import torch
          from src.model import FILANet
          from src.ssl_pretrain import load_ssl_encoder
          ck = torch.load('artifacts/pretrain/gong_ssl_imagenet.pt', map_location='cpu')
          assert ck.get('initialization') == 'imagenet', ck.get('initialization')
          m = FILANet(ck['encoder_name'], False, 128, 4, advanced={'enabled': True})
          load_ssl_encoder(m, ck, strict=True)
          print('ImageNet -> GONG SSL -> FILA-Net strict encoder transfer: OK')
          PY
      - name: Upload corpus checkpoint and manifest
        uses: actions/upload-artifact@v6
        with:
          name: filanet-gong-ssl-imagenet
          path: |
            artifacts/pretrain/gong_ssl_imagenet.pt
            artifacts/pretrain/gong_ssl_imagenet.json
          if-no-files-found: error
