# Final FILA-Net configuration (2 nov 2026): settings of the submitted predictions.
# Network: the 10 checkpoints of weights/manifest.json (ConvNeXt-T and ConvNeXt-S, 5 folds each);
# each checkpoint stores its own architecture, the "model" section below is the first member.
# Post-processing: nested calibration (results/final_run/postprocess_search.json) and the learned
# filament filter weights/rescorer.json (results/final_run/rescoring.json).
# data.root is the Kaggle path; change it to your copy of the competition data.
seed: 2026
n_folds: 5
fold: 0
cv:
  group_mode: day
  fold_file: configs/folds_day5.csv
data:
  root: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026
  train_json: train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  train_images: train/train_images
  test_images: test/test_images
targets:
  width_scale_px: 64.0
model:
  encoder: convnext_tiny.fb_in1k
  pretrained: true
  fpn_channels: 128
  full_res_refine: false
  advanced:
    enabled: true
    limb_gate: true
    multiscale_context: true
    frequency_branch: true
    width_head: true
    curvature_head: true
    endpoint_head: true
    junction_head: true
    uncertainty_head: true
train:
  patch_size: 1024
  epochs: 30
  batch_size: 2
  val_batch_size: 2
  workers: 4
  lr: 0.0002
  min_lr: 1.0e-06
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  amp: true
  val_interval: 2
  val_max_images: null
  validation_tta: false
  warmup_epochs: 1
  ema_decay: 0.0
loss:
  region_bce: 0.25
  region_dice: 0.3
  center_bce: 0.1
  center_dice: 0.15
  boundary_bce: 0.08
  distance: 0.12
  topology: 0.05
  orientation: 0.08
  width: 0.05
  curvature: 0.025
  endpoint: 0.035
  junction: 0.02
  centerline_ce: 0.04
  radius_balance: 0.04
  uncertainty_region: 0.03
inference:
  tile: 1024
  overlap: 256
  tta: true
  amp: true
  region_threshold: 0.45
  center_threshold: 0.45
  min_region_area: 32
  min_instance_area: 300
  bridge_max_distance: 40
  bridge_min_alignment: 0.8
  bridge_min_region: 0.15
  bridge_max_boundary: 0.75
  bridge_max_width_ratio: 4.0
  bridge_width_weight: 0.35
  bridge_geodesic: false
  seed_unmarked_components: false
  fill_holes: false
  instance_dilation: 0
  min_instance_score: 0.7
metric:
  iou_match_threshold: 0.5
  relation_iou_threshold: 0.1
  bootstrap_iterations: 2000
tuning:
  source: results/final_run/postprocess_search.json
  mode: coordinate
  nested_micro_pq: 0.43567643802639017
  selected_oof_micro_pq: 0.43760013142763626
  base_oof_micro_pq: 0.4214321512301028
  subset_images_per_fold: 60
rescoring:
  enabled: true
  model: weights/rescorer.json
  threshold: 0.2608101617049992
  feature_set: maps+image
  candidate_overrides:
    min_instance_score: 0.0
    min_instance_area: 100
  features_version: 2
  variant: permissive/maps+image
  nested_micro_pq_with: 0.44717851353071064
  nested_micro_pq_without: 0.43823851259001617
  source: results/final_run/rescoring.json
