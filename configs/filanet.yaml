seed: 2026
n_folds: 5
fold: 0

cv:
  # day: every observation of the same UT day stays in one fold (GONG sites
  # observe the same Sun minutes apart; filaments persist for days), so the
  # OOF score is not inflated by near-duplicates. 'observation' only groups
  # the annotators of one image; 'month' is a stricter stress test.
  group_mode: day

data:
  # Searched automatically if missing (also /kaggle/input/competitions/...);
  # $FILANET_DATA_ROOT overrides it.
  root: /kaggle/input/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026
  train_json: train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  train_images: train/train_images
  test_images: test/test_images

targets:
  # 1.0 in the width target corresponds to a 64-pixel filament diameter.
  width_scale_px: 64.0

model:
  encoder: convnext_tiny.fb_in1k
  pretrained: true
  fpn_channels: 128
  # Experimental full-resolution refiner (see src/model.py); ablation plus_fullres.
  full_res_refine: false
  advanced:
    enabled: true
    # Innovation registry. Architectural switches are kept explicit so the
    # OOF ablation campaign can disable them independently in future configs.
    limb_gate: true
    multiscale_context: true
    frequency_branch: true
    width_head: true
    curvature_head: true
    endpoint_head: true
    junction_head: true
    uncertainty_head: true

train:
  patch_size: 1024
  epochs: 30
  batch_size: 2
  val_batch_size: 2
  workers: 4
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  amp: true
  # Official micro-PQ validation of the held-out fold (selects fold{k}_best.pt).
  val_interval: 2
  val_max_images: null      # e.g. 60 for faster (noisier) validation
  validation_tta: false
  warmup_epochs: 1
  ema_decay: 0.0            # e.g. 0.999 to validate/save an EMA of the weights

loss:
  region_bce: 0.25
  region_dice: 0.30
  center_bce: 0.10
  center_dice: 0.15
  boundary_bce: 0.08
  distance: 0.12
  topology: 0.05
  orientation: 0.08
  # Advanced losses start deliberately small. OOF ablation decides whether
  # they survive into the final model.
  width: 0.05
  curvature: 0.025
  endpoint: 0.035
  junction: 0.020
  centerline_ce: 0.040
  radius_balance: 0.040
  uncertainty_region: 0.030

inference:
  tile: 1024
  overlap: 256
  tta: true
  # float16 autocast for the forward pass on CUDA (~2x faster on T4 tensor cores);
  # the OOF cache and the test predictions must use the same setting.
  amp: true
  region_threshold: 0.45
  center_threshold: 0.35
  min_region_area: 64
  min_instance_area: 250
  bridge_max_distance: 28
  bridge_min_alignment: 0.80
  bridge_min_region: 0.20
  bridge_max_boundary: 0.75
  bridge_max_width_ratio: 2.5
  bridge_width_weight: 0.35
  # V2 semantics: straight-line bridges (the V3 code silently defaulted to
  # geodesic paths here; configs/filanet_v3.yaml enables them explicitly).
  bridge_geodesic: false
  # V4 options (defaults reproduce V3; calibrated by scripts/optimize_postprocess.py)
  seed_unmarked_components: false
  fill_holes: false
  instance_dilation: 0
  min_instance_score: 0.0

metric:
  # Official: micro PQ over annotator entries, hit = IoU > 0.50 (src/pq_official.py)
  iou_match_threshold: 0.50
  relation_iou_threshold: 0.10   # extra diagnostic; the official plot uses IoU > 0
  bootstrap_iterations: 2000
